name: release

# Every push to main builds and tests all targets; semantic-release decides from the commit messages whether a release
# is due and which version it is (see release.config.js).
on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time: two runs must not compute and publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads every tag and commit
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Next version (dry run)
        id: version
        run: |
          bunx semantic-release --dry-run
          if [ -f .VERSION ]; then echo "next=$(cat .VERSION)" >> "$GITHUB_OUTPUT"; else echo "No release is due."; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.next
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          path: artifacts

      - if: steps.version.outputs.next
        name: Lay out prebuilds/<platform>-<arch>/device_key.node
        run: |
          for dir in artifacts/prebuild-*; do
            target="${dir#artifacts/prebuild-}"
            mkdir -p "prebuilds/$target"
            mv "$dir/device_key.node" "prebuilds/$target/device_key.node"
          done
          test "$(ls prebuilds | wc -l)" -eq 5

      - if: steps.version.outputs.next
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@paratco"

      # The version goes into the packages only here; the repo keeps the placeholder.
      - if: steps.version.outputs.next
        name: Stamp the version, make the platform packages
        run: |
          npm pkg set version="${{ steps.version.outputs.next }}"
          node scripts/platform-packages.mjs

      - if: steps.version.outputs.next
        name: Pack, with release assets and checksums
        run: |
          mkdir assets
          for dir in npm/*; do (cd "$dir" && npm pack --pack-destination ../../assets); done
          npm pack --pack-destination assets
          for dir in prebuilds/*; do cp "$dir/device_key.node" "assets/device_key-$(basename "$dir").node"; done
          (cd assets && sha256sum ./* > SHA256SUMS)

      - if: steps.version.outputs.next
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.node
            assets/*.tgz

      # Two registries: GitHub Packages, where FRS maps the @paratco scope, and npmjs, installable without a token and
      # with provenance. setup-node points the scope at each in turn, so package.json names no registry.
      - if: steps.version.outputs.next
        name: Publish to GitHub Packages
        run: bash scripts/publish.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.next
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@paratco"

      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - if: steps.version.outputs.next
        run: npm install --global npm@^11.5.1

      - if: steps.version.outputs.next
        name: Publish to npmjs
        run: bash scripts/publish.sh --access public --provenance
        env:
          # Only for the first release, which creates the packages; once each has a trusted publisher this secret is
          # deleted and npm authenticates through the workflow's OIDC identity.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Last: the tag and the GitHub release (notes, binaries, tarballs, SHA256SUMS), once everything is published.
      - if: steps.version.outputs.next
        name: Tag and GitHub release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
