name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag names the package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          path: artifacts

      - name: Lay out prebuilds/<platform>-<arch>/device_key.node
        run: |
          for dir in artifacts/prebuild-*; do
            target="${dir#artifacts/prebuild-}"
            mkdir -p "prebuilds/$target"
            mv "$dir/device_key.node" "prebuilds/$target/device_key.node"
          done
          test "$(ls prebuilds | wc -l)" -eq 5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@paratco"

      - name: Pack, with release assets and checksums
        run: |
          npm pack
          mkdir assets
          for dir in prebuilds/*; do cp "$dir/device_key.node" "assets/device_key-$(basename "$dir").node"; done
          cp ./*.tgz assets/
          (cd assets && sha256sum ./* > SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.node
            assets/*.tgz

      - name: Publish to GitHub Packages
        run: npm publish ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
